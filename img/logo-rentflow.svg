<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="400" height="160">
    <!-- Fond sombre -->
    <rect width="500" height="200" fill="#1a1f2e"/>
    
    <!-- Cercle externe blanc -->
    <circle cx="120" cy="80" r="65" fill="none" stroke="white" stroke-width="6"/>
    
    <!-- Cercle interne blanc -->
    <circle cx="120" cy="80" r="55" fill="none" stroke="white" stroke-width="2" opacity="0.5"/>
    
    <!-- Drill/Perceuse à gauche -->
    <g transform="translate(60, 60)">
        <rect x="0" y="8" width="20" height="6" fill="white" rx="2"/>
        <circle cx="20" cy="11" r="5" fill="white"/>
        <rect x="18" y="2" width="4" height="10" fill="white"/>
    </g>
    
    <!-- Camera/Appareil photo -->
    <g transform="translate(120, 50)">
        <rect x="0" y="0" width="30" height="25" fill="none" stroke="white" stroke-width="2" rx="3"/>
        <circle cx="15" cy="12" r="8" fill="none" stroke="white" stroke-width="1.5"/>
        <circle cx="15" cy="12" r="4" fill="white" opacity="0.6"/>
        <circle cx="25" cy="5" r="2" fill="white"/>
    </g>
    
    <!-- Toolbox/Boîte à outils -->
    <g transform="translate(95, 85)">
        <rect x="0" y="0" width="35" height="20" fill="none" stroke="white" stroke-width="2" rx="2"/>
        <line x1="0" y1="8" x2="35" y2="8" stroke="white" stroke-width="1"/>
        <circle cx="10" cy="14" r="2" fill="white"/>
        <circle cx="25" cy="14" r="2" fill="white"/>
    </g>
    
    <!-- Flèche de mouvement -->
    <g transform="translate(40, 70)">
        <line x1="0" y1="0" x2="10" y2="0" stroke="white" stroke-width="3"/>
        <line x1="5" y1="-3" x2="10" y2="0" stroke="white" stroke-width="3"/>
        <line x1="5" y1="3" x2="10" y2="0" stroke="white" stroke-width="3"/>
    </g>
    
    <!-- Texte "RentFlow" en blanc -->
    <text x="60" y="160" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="white">RentFlow</text>
</svg>
